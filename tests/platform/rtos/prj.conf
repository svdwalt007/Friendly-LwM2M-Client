# Zephyr Project Configuration for RTOS Tests
# Used with: west build -b <board> tests/platform/rtos

# Enable C++ support
CONFIG_CPLUSPLUS=y
CONFIG_STD_CPP17=y
CONFIG_EXCEPTIONS=y
CONFIG_RTTI=y

# Heap configuration for memory tests
CONFIG_HEAP_MEM_POOL_SIZE=65536

# Enable heap runtime statistics
CONFIG_SYS_HEAP_RUNTIME_STATS=y

# Thread stack information for stack tests
CONFIG_THREAD_STACK_INFO=y

# Console for test output
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y

# Enable newlib for standard C library
CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_NANO=n

# Increase main stack size for tests
CONFIG_MAIN_STACK_SIZE=4096

# Kernel configuration
CONFIG_NUM_COOP_PRIORITIES=16
CONFIG_NUM_PREEMPT_PRIORITIES=15
CONFIG_TIMESLICE_SIZE=0
CONFIG_TIMESLICE_PRIORITY=0

# Enable thread monitoring
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_NAME=y

# Timer configuration
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000

# Enable assertions for debugging
CONFIG_ASSERT=y
CONFIG_ASSERT_LEVEL=2

# Enable system work queue
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Logging (optional, can be disabled for performance)
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# Debug options (disable for production)
CONFIG_DEBUG=y
CONFIG_DEBUG_INFO=y
CONFIG_DEBUG_OPTIMIZATIONS=n
